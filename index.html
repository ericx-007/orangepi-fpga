<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPGA 数码管控制台</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#10151c;color:#edf3fa}*{box-sizing:border-box}body{margin:0;padding:40px 20px}main{max-width:880px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}small{color:#a3b5c8}h1{font-size:28px;margin:8px 0 30px}.badge{border:1px solid #8b7350;color:#f5cd8a;padding:8px 12px;border-radius:24px;font-size:13px}.badge.on{border-color:#429c80;color:#8ff0c6}.card{background:#19222e;border:1px solid #2b3949;border-radius:18px;padding:26px;margin:16px 0}.digits{font-family:monospace;font-size:clamp(28px,7vw,64px);letter-spacing:.12em;color:#74e9c3;margin:16px 0;overflow-wrap:anywhere}form{display:flex;gap:12px;flex-wrap:wrap}input{min-width:0;flex:1;background:#10151c;border:1px solid #45617b;border-radius:9px;padding:14px;color:white;font:22px monospace}button{background:#86e1c3;color:#10241e;border:0;border-radius:9px;padding:14px 22px;font-size:16px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:12px;flex-wrap:wrap}.key{padding:14px 22px;border:1px solid #405165;border-radius:10px;color:#9dacc0}.key.pressed{background:#86e1c3;color:#10241e}.info{color:#c0cfde;line-height:1.7;min-height:28px}footer{font-size:13px;color:#9dacc0;padding:10px}output{display:block}#notice{color:#f5cd8a}
</style>
<main>
<header><div><small>ORANGE PI × GOWIN FPGA</small><h1>数码管控制台</h1></div><span id="badge" class="badge">正在连接服务</span></header>
<section class="card"><small>FPGA 回读的显示值</small><output id="display" class="digits">--------</output><form id="form"><input id="digits" aria-label="八位显示数字" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" value="12345678" required><button id="send" disabled>发送到数码管</button></form><p id="notice" class="info" role="status">正在读取连接状态…</p><small>请输入 8 位数字，可保留开头的 0。上方显示值以 FPGA 回读为准。</small></section>
<section class="card"><h2>实体按键</h2><div class="row" id="keys"><span class="key">K1 · 未知</span><span class="key">K2 · 未知</span><span class="key">K3 · 未知</span><span class="key">K4 · 未知</span></div><p class="info">按下事件：<span id="events">未知</span></p></section>
<section class="card"><h2>两排拨码开关</h2><p class="info">拨到 ON 为 1，另一侧为 0。每排 8 位，对应一个 0–255 的数；本演示只读取开关，不改变数码管。</p><p>SW1 · 第一排 <span id="sw1value"></span></p><div class="row" id="sw1"></div><p>SW2 · 第二排 <span id="sw2value"></span></p><div class="row" id="sw2"></div><p class="info">合并二进制：<span id="switches">未知</span></p></section>
<footer>通信状态每 300 ms 更新。FPGA 未应答时禁用发送，页面不模拟硬件数据。</footer>
</main>
<script>
const token='__TOKEN__';let posting=false;
for(const id of ['sw1','sw2'])for(let i=1;i<=8;i++){const e=document.createElement('span');e.className='key';e.style.padding='10px 12px';e.textContent=i+' · 未知';document.getElementById(id).appendChild(e)}
function updateSwitches(s){for(let row=0;row<2;row++){const known=s.connected&&s.switches!==null;const value=(s.switches>>((1-row)*8))&255;document.getElementById('sw'+(row+1)+'value').textContent=known?'= '+value:'';[...document.getElementById('sw'+(row+1)).children].forEach((e,i)=>{const on=known&&((value>>i)&1);e.className='key'+(on?' pressed':'');e.textContent=(i+1)+' · '+(!known?'未知':on?'ON':'OFF')})}}
async function refresh(){try{const r=await fetch('/api/state');if(!r.ok)throw Error('状态读取失败');const s=await r.json();updateSwitches(s);badge.textContent=s.connected?'FPGA 已连接':'FPGA 未连接';badge.className='badge'+(s.connected?' on':'');display.textContent=s.confirmed??'--------';send.disabled=!s.connected||posting;notice.textContent=s.connected?(s.requested&&s.requested!==s.confirmed?'等待 FPGA 确认 '+s.requested:'显示值已回读确认'):s.error||'等待 FPGA 应答';[...keys.children].forEach((e,i)=>{const known=s.connected&&s.buttons!==null;const down=known&&((s.buttons>>i)&1);e.className='key'+(down?' pressed':'');e.textContent='K'+(i+1)+' · '+(!known?'未知':down?'按下':'松开')});switches.textContent=s.connected?s.switches.toString(2).padStart(16,'0'):'未知';events.textContent=s.connected?s.event_count:'未知'}catch(e){badge.textContent='服务连接中断';badge.className='badge';send.disabled=true;notice.textContent=e.message}finally{setTimeout(refresh,300)}}
form.addEventListener('submit',async e=>{e.preventDefault();posting=true;send.disabled=true;try{const r=await fetch('/api/display',{method:'POST',headers:{'Content-Type':'application/json','X-Panel-Token':token},body:JSON.stringify({digits:digits.value})});const v=await r.json();if(!r.ok)throw Error(v.error);notice.textContent=v.message}catch(e){notice.textContent=e.message}finally{posting=false}});refresh();
</script>
</html>
